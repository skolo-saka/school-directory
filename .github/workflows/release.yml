name: Release

# Creates the GitHub release for a v<version> tag on main, after the same tests as CI. Releases are what
# deployments vendor (see RELEASING.md); nothing is published to a registry and no secrets are used.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: school_directory_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: local-test-only
      PGDATABASE: school_directory_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag is on main and has changelog notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          grep -q "^## ${TAG#v} " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## ${TAG#v} (date)' section"; exit 1; }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile school_directory.py
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test tests/search-api.test.mjs
      - run: psql -v ON_ERROR_STOP=1 -c 'create role anon; create role authenticated; create role service_role bypassrls;'
      - run: psql -v ON_ERROR_STOP=1 -f sql/001_school_directory.sql
      - run: psql -v ON_ERROR_STOP=1 -f sql/002_school_search.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/integration.sql

  release:
    name: GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
